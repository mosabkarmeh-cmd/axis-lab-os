name: Repair package lock for v0.15.0

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/v0.15.0-final'

permissions:
  contents: write

jobs:
  repair-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Commit updated lockfile
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git status --porcelain package-lock.json) {
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile with v0.15.0 dependencies'
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host 'package-lock.json is already synchronized.'
          }
