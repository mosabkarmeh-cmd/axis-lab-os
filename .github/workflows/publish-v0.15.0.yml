name: Publish v0.15.0 Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Validate TypeScript
        run: npm run lint
      - name: Full smoke suite
        run: npm run test:smoke
      - name: Network smoke
        run: npm run test:network
      - name: Stress smoke
        run: npm run test:stress
      - name: Prepare release assets
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-assets | Out-Null
      - name: Build Current User installer
        run: npm run desktop:package:win:current -- --publish never
      - name: Preserve Current User installer
        shell: pwsh
        run: |
          $current = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $current) { throw 'Current User installer missing immediately after Current User build.' }
          Copy-Item $current.FullName (Join-Path $env:GITHUB_WORKSPACE 'release-assets\AXIS-LAB-OS-Setup-0.15.0.exe') -Force
      - name: Build All Users installer
        run: npm run desktop:package:win:all -- --publish never
      - name: Preserve All Users installer
        shell: pwsh
        run: |
          $allUsers = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          if (-not $allUsers) { throw 'All Users installer missing immediately after All Users build.' }
          Copy-Item $allUsers.FullName (Join-Path $env:GITHUB_WORKSPACE 'release-assets\AXIS-LAB-OS-Setup-0.15.0-AllUsers.exe') -Force
      - name: Verify installers
        shell: pwsh
        run: |
          $current = Join-Path $env:GITHUB_WORKSPACE 'release-assets\AXIS-LAB-OS-Setup-0.15.0.exe'
          $allUsers = Join-Path $env:GITHUB_WORKSPACE 'release-assets\AXIS-LAB-OS-Setup-0.15.0-AllUsers.exe'
          if (-not (Test-Path $current)) { throw 'Current User installer was not preserved.' }
          if (-not (Test-Path $allUsers)) { throw 'All Users installer was not preserved.' }
          Get-ChildItem release-assets | Format-Table Name,Length
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'v0.15.0'
          $existing = gh release view $tag --json tagName 2>$null
          if (-not $existing) {
            gh release create $tag release-assets/*Setup*.exe --title 'AXIS LAB OS v0.15.0' --generate-notes
          } else {
            gh release upload $tag release-assets/*Setup*.exe --clobber
          }
