name: Publish v0.15.0 Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release: publish v0.15.0 Windows installers from main')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Validate TypeScript
        run: npm run lint
      - name: Full smoke suite
        run: npm run test:smoke
      - name: Network smoke
        run: npm run test:network
      - name: Stress smoke
        run: npm run test:stress
      - name: Build Current User installer
        run: npm run desktop:package:win:current -- --publish never
      - name: Build All Users installer
        run: npm run desktop:package:win:all -- --publish never
      - name: Verify installers
        shell: pwsh
        run: |
          $current = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          $allUsers = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          if (-not $current) { throw 'Current User installer missing.' }
          if (-not $allUsers) { throw 'All Users installer missing.' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $current.FullName release-assets/
          Copy-Item $allUsers.FullName release-assets/
          Get-ChildItem release-assets | Format-Table Name,Length
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'v0.15.0'
          $existing = gh release view $tag --json tagName 2>$null
          if (-not $existing) {
            gh release create $tag release-assets/*Setup*.exe release-assets/*AllUsers*.exe --title 'AXIS LAB OS v0.15.0' --generate-notes
          } else {
            gh release upload $tag release-assets/*Setup*.exe release-assets/*AllUsers*.exe --clobber
          }
