name: Windows Unpacked QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unpacked-qa:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Validate and test backend
        run: npm run test:smoke

      - name: Build unpacked Windows application
        run: npx electron-builder --win dir --config electron-builder.yml --publish never

      - name: Launch Current User unpacked application and verify local server
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist\win-unpacked\AXIS LAB OS.exe'
          if (-not (Test-Path $app)) { throw "Unpacked application not found: $app" }
          $stdout = Join-Path $env:RUNNER_TEMP 'axis-lab-electron.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'axis-lab-electron.stderr.log'
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3210/api/health' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '"database":"sqlite"') {
                  $healthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) {
              Write-Host '--- Electron stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- Electron stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              Write-Host '--- Matching processes ---'
              Get-Process | Where-Object { $_.ProcessName -match 'AXIS|electron' } | Format-Table Id,ProcessName,Path -AutoSize
              throw 'The unpacked Electron application did not expose a healthy local SQLite API within two minutes.'
            }
            Write-Host 'Unpacked Windows application health check: PASS'
          } finally {
            Get-Process -Name 'AXIS LAB OS' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { $process.Kill() }
          }

      - name: Build All Users unpacked Windows application
        run: npx electron-builder --win dir --config electron-builder.all-users.yml --publish never

      - name: Launch All Users unpacked application and verify local server
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist-all-users\win-unpacked\AXIS LAB OS.exe'
          if (-not (Test-Path $app)) { throw "All Users unpacked application not found: $app" }
          $scope = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'dist-all-users\win-unpacked\resources\install-scope.txt') -Raw
          if ($scope.Trim() -ne 'all-users') { throw "Unexpected install scope: $scope" }
          $stdout = Join-Path $env:RUNNER_TEMP 'axis-lab-all-users.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'axis-lab-all-users.stderr.log'
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3210/api/health' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '"database":"sqlite"') {
                  $healthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) {
              Write-Host '--- All Users Electron stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- All Users Electron stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'The All Users unpacked application did not expose a healthy local SQLite API within two minutes.'
            }
            Write-Host 'All Users unpacked Windows application health check: PASS'
          } finally {
            Get-Process -Name 'AXIS LAB OS' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { $process.Kill() }
          }
