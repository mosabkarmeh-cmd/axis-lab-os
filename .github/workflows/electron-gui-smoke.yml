name: Electron GUI Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  electron-gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build application
        run: npm run build

      - name: Install Playwright test runtime
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Build unpacked Current User application
        run: npx electron-builder --win dir --config electron-builder.yml --publish never

      - name: Launch real packaged Electron application with CDP
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist\win-unpacked\AXIS LAB OS.exe'
          if (-not (Test-Path $app)) { throw "Packaged Electron application not found: $app" }
          $stdout = Join-Path $env:RUNNER_TEMP 'axis-lab-gui.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'axis-lab-gui.stderr.log'
          $process = Start-Process -FilePath $app -ArgumentList '--remote-debugging-port=9222' -WorkingDirectory (Split-Path $app) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $cdpReady = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:9222/json/version' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $cdpReady = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $cdpReady) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Electron DevTools Protocol endpoint did not become ready.'
            }
            node tests/electron-gui-smoke.cjs
          } finally {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            Get-Process -Name 'AXIS LAB OS' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'electron' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload GUI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: axis-lab-electron-gui-diagnostics
          path: |
            ${{ runner.temp }}/axis-lab-gui.stdout.log
            ${{ runner.temp }}/axis-lab-gui.stderr.log
          if-no-files-found: ignore