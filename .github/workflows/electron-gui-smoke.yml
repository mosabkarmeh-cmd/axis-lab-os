name: Electron GUI Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  electron-gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build application
        run: npm run build

      - name: Install Playwright test runtime
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Build unpacked Current User application
        run: npx electron-builder --win dir --config electron-builder.yml --publish never

      - name: Launch and drive the real packaged Electron application
        shell: pwsh
        env:
          AXIS_APP_PATH: ${{ github.workspace }}\dist\win-unpacked\AXIS LAB OS.exe
          AXIS_GUI_SCREENSHOT: ${{ runner.temp }}\axis-lab-gui-failure.png
          NODE_ENV: development
          ALLOW_PUBLIC_REGISTRATION: "false"
          AXIS_GUI_TEST: "1"
        run: |
          if (-not (Test-Path $env:AXIS_APP_PATH)) { throw "Packaged Electron application not found: $env:AXIS_APP_PATH" }
          node tests/electron-gui-smoke.cjs
      - name: Upload GUI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: axis-lab-electron-gui-diagnostics
          path: |
            ${{ runner.temp }}/axis-lab-gui.stdout.log
            ${{ runner.temp }}/axis-lab-gui.stderr.log
            ${{ runner.temp }}/axis-lab-gui-failure.png
          if-no-files-found: ignore