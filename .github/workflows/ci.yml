name: Axis Lab OS CI

on:
  push:
    branches:
      - refactor/v0.15.0-final
  pull_request:
    branches:
      - refactor/v0.15.0-final

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
      - name: Decomposition audit
        run: npm run test:decomposition
      - name: Static source audit
        run: npm run test:source
      - name: Static security audit
        run: npm run test:security-static
      - name: Employee financial boundary smoke
        run: npm run test:employee-boundary
