name: Windows CI

on:
  push:
    branches:
      - 'refactor/v0.15.0-final'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: node scripts/github-branch-sanity.cjs
      - run: npm run lint
