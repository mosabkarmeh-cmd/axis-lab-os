name: Windows CI

on:
  push:
    branches:
      - main
      - 'refactor/v0.15.0-final'
  pull_request:
    branches:
      - main
      - 'refactor/v0.15.0-final'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: TypeScript validation
        run: npm run lint
      - name: Decomposition audit
        run: npm run test:decomposition
      - name: Static source audit
        run: npm run test:source
      - name: Architecture audit
        run: npm run test:architecture
      - name: Static security audit
        run: npm run test:security-static
      - name: Desktop security smoke
        run: npm run test:desktop-security
      - name: Full backend smoke suite
        run: npm run test:smoke
      - name: Network smoke
        run: npm run test:network
      - name: Stress smoke
        run: npm run test:stress
      - name: Windows current-user installer
        run: npm run desktop:package:win:current -- --publish never
      - name: Preserve current-user installer
        shell: pwsh
        run: |
          $current = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $current) { throw 'Current User installer was not produced.' }
          Copy-Item $current.FullName (Join-Path $env:RUNNER_TEMP 'axis-lab-current-user-setup.exe')
      - name: Windows all-users installer
        run: npm run desktop:package:win:all -- --publish never
      - name: Verify installer outputs
        shell: pwsh
        run: |
          $current = Get-Item (Join-Path $env:RUNNER_TEMP 'axis-lab-current-user-setup.exe')
          $allUsers = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          if (-not $current) { throw 'Current User installer was not preserved.' }
          if (-not $allUsers) { throw 'All Users installer was not produced.' }
          Write-Host "Current User: $($current.FullName)"
          Write-Host "All Users: $($allUsers.FullName)"
      - name: Install and launch current-user installer
        shell: pwsh
        run: |
          $setup = Get-Item (Join-Path $env:RUNNER_TEMP 'axis-lab-current-user-setup.exe')
          $target = Join-Path $env:RUNNER_TEMP 'axis-lab-current-user'
          Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait
          $app = Join-Path $target 'AXIS LAB OS.exe'
          if (-not (Test-Path $app)) { throw "Current User application was not installed: $app" }
          $process = Start-Process -FilePath $app -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3210/api/health' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '"database":"sqlite"') { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw 'Current User installed application did not expose a healthy SQLite API.' }
            Write-Host 'Current User installer/runtime: PASS'
          } finally {
            Get-Process -Name 'AXIS LAB OS' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { $process.Kill() }
          }
      - name: Install and launch all-users installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'axis-lab-all-users'
          Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait
          $app = Join-Path $target 'AXIS LAB OS.exe'
          if (-not (Test-Path $app)) { throw "All Users application was not installed: $app" }
          $process = Start-Process -FilePath $app -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3210/api/health' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match '"database":"sqlite"') { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw 'All Users installed application did not expose a healthy SQLite API.' }
            Write-Host 'All Users installer/runtime: PASS'
          } finally {
            Get-Process -Name 'AXIS LAB OS' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { $process.Kill() }
          }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: axis-lab-os-v0.15.0-windows-installers
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/axis-lab-current-user-setup.exe
            dist-all-users/**/*AllUsers*.exe
