name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      HAS_CODE_SIGNING: ${{ secrets.CSC_CERT_BASE64 != '' && secrets.CSC_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify release tag integrity
        shell: pwsh
        run: |
          git fetch origin main --no-tags --depth=1
          $tagSha = (git rev-parse HEAD).Trim()
          $mainSha = (git rev-parse origin/main).Trim()
          if ($tagSha -ne $mainSha) {
            throw "Release tag $env:GITHUB_REF_NAME does not point to current main. Tag=$tagSha Main=$mainSha"
          }
          $packageVersion = (node -p "require('./package.json').version").Trim()
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "Package version $packageVersion does not match release tag $env:GITHUB_REF_NAME"
          }
          Write-Host "Release integrity: tag=$env:GITHUB_REF_NAME sha=$tagSha version=$packageVersion"

          $requiredWorkflows = @(
            'Electron GUI Smoke',
            'Windows Unpacked QA'
          )
          foreach ($workflowName in $requiredWorkflows) {
            $runsJson = gh run list --workflow $workflowName --commit $tagSha --limit 10 --json status,conclusion,headSha
            $runs = @($runsJson | ConvertFrom-Json | Where-Object { $_.headSha -eq $tagSha })
            $successful = $runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' }
            if (-not $successful) {
              throw "Required workflow '$workflowName' has no successful completed run for $tagSha"
            }
            Write-Host "Release CI gate: $workflowName PASS"
          }

      - name: Deterministic release gate
        run: npm run test:release-gate
      - name: Full backend smoke test
        run: npm run test:smoke
      - name: Network smoke test
        run: npm run test:network
      - name: Stress smoke test
        run: npm run test:stress
      - name: Configure Windows code signing
        if: ${{ env.HAS_CODE_SIGNING == 'true' }}
        shell: pwsh
        env:
          CSC_CERT_BASE64: ${{ secrets.CSC_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $certPath = Join-Path $env:GITHUB_WORKSPACE 'axis-lab-code-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CSC_CERT_BASE64))
          "CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Windows code signing certificate configured.'
      - name: Release signing gate
        if: ${{ env.HAS_CODE_SIGNING != 'true' }}
        shell: pwsh
        run: |
          throw 'Official GitHub Releases are blocked until Windows code-signing secrets CSC_CERT_BASE64 and CSC_KEY_PASSWORD are configured.'
      - name: Build Windows installer (Current User)
        run: npm run desktop:package:win:current -- --publish never

      - name: Preserve Current User release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item (Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1).FullName release-assets/
          Copy-Item (Get-ChildItem -Path dist -Filter '*.blockmap' | Select-Object -First 1).FullName release-assets/
          Copy-Item (Get-ChildItem -Path dist -Filter 'latest*.yml' | Select-Object -First 1).FullName release-assets/

      - name: Build Windows installer (All Users)
        run: npm run desktop:package:win:all -- --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-assets -Filter '*Setup*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem -Path release-assets -Filter '*.blockmap' | Select-Object -First 1
          $latest = Get-ChildItem -Path release-assets -Filter 'latest*.yml' | Select-Object -First 1
          $allUsers = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          if (-not $latest) { throw 'electron-builder did not produce latest*.yml; auto-update metadata is missing.' }
          if (-not $allUsers) { throw 'All Users installer was not produced.' }
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json tagName 2>$null | ConvertFrom-Json
          if (-not $release) {
            gh release create $tag --generate-notes --title "AXIS LAB OS $tag"
          }
          gh release upload $tag $installer.FullName $blockmap.FullName $latest.FullName $allUsers.FullName --clobber
