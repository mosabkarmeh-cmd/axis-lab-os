name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (Current User)
        run: npm run desktop:package:win:current -- --publish never

      - name: Preserve Current User release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item (Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1).FullName release-assets/
          Copy-Item (Get-ChildItem -Path dist -Filter '*.blockmap' | Select-Object -First 1).FullName release-assets/
          Copy-Item (Get-ChildItem -Path dist -Filter 'latest*.yml' | Select-Object -First 1).FullName release-assets/

      - name: Build Windows installer (All Users)
        run: npm run desktop:package:win:all -- --publish never

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-assets -Filter '*Setup*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem -Path release-assets -Filter '*.blockmap' | Select-Object -First 1
          $latest = Get-ChildItem -Path release-assets -Filter 'latest*.yml' | Select-Object -First 1
          $allUsers = Get-ChildItem -Path dist-all-users -Filter '*AllUsers*.exe' -Recurse | Select-Object -First 1
          if (-not $latest) { throw 'electron-builder did not produce latest*.yml; auto-update metadata is missing.' }
          if (-not $allUsers) { throw 'All Users installer was not produced.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $blockmap.FullName $latest.FullName $allUsers.FullName --generate-notes --title "AXIS LAB OS $env:GITHUB_REF_NAME"

